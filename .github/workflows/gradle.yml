
name: Build Hambi Lite APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project structure
        run: |
          mkdir -p app/src/main/java/uz/hambilite/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi

          cp MainActivity.java app/src/main/java/uz/hambilite/app/
          cp AndroidManifest.xml app/src/main/
          cp styles.xml app/src/main/res/values/
          cp colors.xml app/src/main/res/values/colors.xml
          cp ic_launcher.png app/src/main/res/mipmap-mdpi/
          cp ic_launcher_round.png app/src/main/res/mipmap-mdpi/

          mv build.gradle app/build.gradle

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HambiLite"
          include(":app")
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hambi-Lite-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
